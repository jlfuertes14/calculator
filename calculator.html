<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <h1 class="calc">Orion Calculator</h1>
        <div class="display-container">
            <output class="display"> </output>
        </div>
        <div class="grid-container">

            <button class="btn-operators" data-value="clear">A/C</button>
            <button class="btn-numbers" id="zeroes">00</button>
            <button class="btn-operators" data-value="percent">％</button>
            <button class="btn-operators" data-value="divide">➗</button>

            <button class="btn-numbers" id="seven">7</button>
            <button class="btn-numbers" id="eight">8</button>
            <button class="btn-numbers" id="nine">9</button>
            <button class="btn-operators" data-value="multiply">✖️ </button>
  
            <button class="btn-numbers" id="four">4</button>
            <button class="btn-numbers" id="five/">5</button>
            <button class="btn-numbers" id="six">6</button>
            <button class="btn-operators" data-value="subtract">➖</button>

            <button class="btn-numbers" id="one">1</button>
            <button class="btn-numbers" id="two">2</button>
            <button class="btn-numbers" id="three">3</button>
            <button class="btn-operators" data-value="add">➕</button>
  
            <button class="btn-numbers" id="zero">0</button>
            <button class="btn-notation" id="dot">.</button>
            <button class="btn-equal">=</button>
        </div>
    </div>
    <script src="./calculatorProj.js"></script>
</html>
